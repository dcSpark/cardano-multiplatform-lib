name: PR Checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'
          cache: 'npm'
      # Cargo registry/git + target caching, keyed on rustc version and manifests, with
      # stale-target cleanup. No committed Cargo.lock here, so hand-rolled hashFiles keys
      # don't work — this action handles it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # The Rust toolchain, components (rustfmt/clippy) and wasm32 target are pinned in
      # rust-toolchain.toml and auto-installed by rustup on first cargo invocation.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Provides wasm-bindgen-test-runner for the wasm runtime tests below. Must match the
      # wasm-bindgen lib version; bump together. Prebuilt by install-action (no compile).
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: install
        run: npm install
      - name: rust:test
        run: npm run rust:test
      - name: rust:build-nodejs
        run: npm run rust:build-nodejs
      - name: rust:build-browser
        run: npm run rust:build-browser
      - name: cargo-fmt
        run: cargo fmt --all -- --check
      - name: cargo-clippy
        # clippy::all gate. The --allow list is for lints that fire predominantly on
        # cddl-codegen-generated code, where hand-fixes would be reverted on the next regen.
        # Trim this list as the codegen improves.
        run: >
          cargo clippy --workspace --all-features --all-targets --
          --deny clippy::all
          --allow clippy::result_large_err
          --allow clippy::large_enum_variant
          --allow clippy::useless_conversion
          --allow clippy::empty_line_after_doc_comments
          --allow clippy::manual_repeat_n
          --allow clippy::single_match
          --allow clippy::double_ended_iterator_last
          --allow clippy::derivable_impls
      - name: all:test
        run: cargo test
      # Runtime check that key generation works on wasm (getrandom wasm_js -> crypto.getRandomValues).
      # Also builds crypto/wasm standalone, which catches per-crate feature-unification gaps.
      # Driven via cargo + the configured wasm-bindgen-test-runner (not `wasm-pack test`, which
      # force-downloads the *latest* chromedriver and would mismatch a non-latest runner Chrome).
      # The chrome run uses the runner's pre-matched driver ($CHROMEWEBDRIVER); webdriver.json
      # (in crypto/wasm) supplies --no-sandbox. If chrome is ever unavailable, --node is the gate.
      - name: wasm:keygen-runtime (node)
        run: cargo test --target wasm32-unknown-unknown -p cml-crypto-wasm --test keygen_runtime
      - name: wasm:keygen-runtime (chrome)
        working-directory: crypto/wasm
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" cargo test --target wasm32-unknown-unknown --test keygen_browser
      - name: cml:install
        working-directory: cml/wasm
        run: npm install
      - name: cml:rust:build-nodejs
        working-directory: cml/wasm
        run: npm run rust:build-nodejs
      - name: cml:rust:build-browser
        working-directory: cml/wasm
        run: npm run rust:build-browser
      - name: multi-era:install
        working-directory: multi-era/wasm
        run: npm install
      - name: multi-era:rust:build-nodejs
        working-directory: multi-era/wasm
        run: npm run rust:build-nodejs
      - name: multi-era:rust:build-browser
        working-directory: multi-era/wasm
        run: npm run rust:build-browser

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        # Advisory-only until the dependency modernization pass; then remove continue-on-error.
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
