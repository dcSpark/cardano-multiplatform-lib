[workspace]
resolver = "2"

# this is for the new crate structure. The legacy code (current CML) still resides in the `rust` directory.
members = [
    "chain/rust",
    "chain/wasm",
    "chain/wasm/json-gen",
    "cip25/rust",
    "cip25/wasm",
    "cip25/wasm/json-gen",
    "cip36/rust",
    "cip36/wasm",
    "cip36/wasm/json-gen",
    "cml/wasm",
    "cml/wasm/json-gen",
    "core/rust",
    "core/wasm",
    "crypto/rust",
    "crypto/wasm",
    "multi-era/rust",
    "multi-era/wasm",
    "multi-era/wasm/json-gen"
]

# exclude old crate structure to avoid error in it
exclude = [
    "rust",
    "rust/json-gen",
    "tools/metadata-cddl-checker",
    "tools/plutus-datum-codegen"
]

[profile.release]
lto = true
opt-level = "z"

[workspace.dependencies]
cbor_event = "2.4.0"
hex = "0.4.0"
linked-hash-map = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.57"
serde-wasm-bindgen = "0.4.5"
wasm-bindgen = { version = "0.2.97" }
schemars = "0.8.8"
derivative = "2.2.0"
thiserror = "1.0.37"