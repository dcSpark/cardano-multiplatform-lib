[package]
name = "cml-chain"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for main Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
used_from_wasm = ["dep:wasm-bindgen"]
default = ["std"]
# NOTE: the [features] table is co-owned by cddl-codegen (it asserts the keys); the forwarding
# list below is hand-maintained — see core/rust/Cargo.toml for the upstream filing. If a regen
# ever flattens this back to a bare `std = []`, re-apply it.
std = [
    "cml-core/std",
    "cml-crypto/std",
    "serde/std",
    "serde_json/std",
    "schemars/std",
    "hex/std",
    "bech32/std",
    "base64/std",
    "thiserror/std",
    "itertools/use_std",
    "num-bigint/std",
    "num-integer/std",
    "num/std",
    "chrono/std",
    "rand/std",
    "rand/thread_rng",
]

[dependencies]
cml-core = { path = "../../core/rust", version = "6.2.0", default-features = false }
cml-crypto = { path = "../../crypto/rust", version = "6.2.0", default-features = false }
cbor_event = { git = "https://github.com/dcSpark/cbor_event", rev = "e2bca6d257f70ab0c226c4efd0726d3f5c1b4490" }
derivative = { version = "2.2.0", features = ["use_core"] }
serde = { version = "1.0.152", features = ["derive", "alloc"], default-features = false }
serde_json = { version = "1.0.57", features = ["arbitrary_precision", "float_roundtrip", "alloc"], default-features = false }
schemars = { version = "1.2.1", features = ["derive"], default-features = false }

bech32 = { version = "0.12.0", features = ["alloc"], default-features = false }
hex = { version = "1.19.1", features = ["alloc", "core-error"], default-features = false, package = "const-hex" }
itertools = { version = "0.15.0", features = ["use_alloc"], default-features = false }
# getrandom (OS entropy for rand) + its wasm_js feature are declared once in cml-crypto,
# which every rand-using crate here depends on; see crypto/rust/Cargo.toml.
rand = { version = "0.10.1", features = ["alloc"], default-features = false }
base64 = { version = "0.22.1", features = ["alloc"], default-features = false }
num-bigint = { version = "0.4.6", default-features = false }
num-integer = { version = "0.1.46", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
# `alloc` rather than bare default-features=false: fees.rs uses num::rational::BigRational,
# which needs num-bigint wired through num-rational.
num = { version = "0.4.3", features = ["alloc"], default-features = false }
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", features = ["alloc"], default-features = false }

# non-wasm
noop_proc_macro = { version = "0.3.0", optional = false }

# wasm
wasm-bindgen = { version = "0.2.126", optional = true }
hashlink = "0.12.1"


[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rand_chacha = "0.10.0"
flaky_test = "0.2.2"
# Validates the hand-authored JSON schemas in src/json/custom_schemas/ against what the
# hand-written serde impls actually emit (src/json/custom_schemas_tests.rs).
jsonschema = "0.49.1"
