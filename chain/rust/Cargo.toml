[package]
name = "cml-chain"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for main Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
used_from_wasm = ["dep:wasm-bindgen"]

[dependencies]
cml-core = { "path" = "../../core/rust", version = "6.2.0" }
cml-crypto = { "path" = "../../crypto/rust", version = "6.2.0" }
cbor_event = "3.2.0"
linked-hash-map = "0.5.6"
derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.57", features = ["arbitrary_precision", "float_roundtrip"] }
schemars = "1.2.1"

bech32 = "0.12.0"
hex = "0.4.3"
itertools = "0.15.0"
# getrandom (OS entropy for rand) + its wasm_js feature are declared once in cml-crypto,
# which every rand-using crate here depends on; see crypto/rust/Cargo.toml.
rand = "0.10.1"
fraction = "0.15.4"
base64 = "0.22.1"
num-bigint = "0.4.6"
num-integer = "0.1.46"
thiserror = "2.0.18"
num = "0.4.3"
unicode-segmentation = "1.13.3"
chrono = "0.4.45"

# non-wasm
noop_proc_macro = { version = "0.3.0", optional = false }

# wasm
wasm-bindgen = { version = "0.2.126", optional = true }


[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rand_chacha = "0.10.0"
flaky_test = "0.2.2"
