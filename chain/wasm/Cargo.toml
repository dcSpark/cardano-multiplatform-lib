[package]
name = "cml-chain-wasm"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform WASM SDK for main Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-chain = { path = "../rust" , version = "6.2.0", features = ["used_from_wasm"] }
cml-core = { path = "../../core/rust", version = "6.2.0" }
cml-core-wasm = { path = "../../core/wasm", version = "6.2.0" }
# TODO: remove this dependency if possible to reduce confusion? maybe pub export necessary things in crypto-wasm?
cml-crypto = { path = "../../crypto/rust", version = "6.2.0" }
cml-crypto-wasm = { path = "../../crypto/wasm", version = "6.2.0" }
cbor_event = "3.2.0"
hex = "0.4.0"
wasm-bindgen = { version = "0.2.126" }
linked-hash-map = "0.5.6"
serde_json = { version = "1.0.57", features = ["float_roundtrip"] }
serde-wasm-bindgen = "0.6.5"
serde = "1.0.152"
