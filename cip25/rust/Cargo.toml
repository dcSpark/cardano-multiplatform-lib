[package]
name = "cml-cip25"
version = "6.0.1"
edition = "2018"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for CIP25 Cardano NFT Metadata functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano", "cip25"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-chain = { "path" = "../../chain/rust", version = "6.0.1" }
cml-core = { "path" = "../../core/rust", version = "6.0.1" }
cml-crypto = { "path" = "../../crypto/rust", version = "6.0.1" }
cbor_event.workspace = true
hex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# for enums
wasm-bindgen.workspace = true
