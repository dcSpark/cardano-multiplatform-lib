[package]
name = "cml-cip25-wasm"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform WASM SDK for CIP25 Cardano NFT Metadata functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano", "cip25"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cbor_event = "3.2.0"
cml-chain = { path = "../../chain/rust", version = "6.2.0", features = ["used_from_wasm"] }
cml-chain-wasm = { path = "../../chain/wasm", version = "6.2.0" }
cml-core = { path = "../../core/rust", version = "6.2.0" }
cml-core-wasm = { path = "../../core/wasm", version = "6.2.0" }
cml-cip25 = { path = "../rust" , version = "6.2.0" }
hex = "0.4.0"
linked-hash-map = "0.5.6"
serde_json = { version = "1.0.57", features = ["float_roundtrip"] }
serde-wasm-bindgen = "0.6.5"
serde = "1.0.152"
wasm-bindgen = { version = "0.2.126" }
