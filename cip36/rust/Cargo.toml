[package]
name = "cml-cip36"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for CIP36 Catalyst voting functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano", "cip36"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-core = { "path" = "../../core/rust", version = "6.2.0" }
cml-crypto = { "path" = "../../crypto/rust", version = "6.2.0" }
cml-chain = { "path" = "../../chain/rust", version = "6.2.0" }
cbor_event = { git = "https://github.com/dcSpark/cbor_event", rev = "e2bca6d257f70ab0c226c4efd0726d3f5c1b4490" }
linked-hash-map = "0.5.6"
derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.57", features = ["float_roundtrip"] }
schemars = "1.2.1"
hex = "0.4.3"
thiserror = "2.0.18"

[features]
used_from_wasm = []
