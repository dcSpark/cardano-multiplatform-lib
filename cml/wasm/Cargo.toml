[package]
name = "cardano-multiplatform-lib"
version = "6.2.0"
edition = "2024"
keywords = ["cardano"]
license = "MIT"
description = "Multiplatform WASM SDK containing the most common CML crates for Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-chain-wasm = { path = "../../chain/wasm", version = "6.2.0" }
cml-cip25-wasm = { path = "../../cip25/wasm", version = "6.2.0" }
cml-cip36-wasm = { path = "../../cip36/wasm", version = "6.2.0" }
cml-crypto-wasm = { path = "../../crypto/wasm", version = "6.2.0" }
cml-core-wasm = { path = "../../core/wasm", version = "6.2.0" }
cbor_event = { git = "https://github.com/dcSpark/cbor_event", rev = "e2bca6d257f70ab0c226c4efd0726d3f5c1b4490" }
hex = "0.4.0"
linked-hash-map = "0.5.6"
serde_json = "1.0.57"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.126" }
