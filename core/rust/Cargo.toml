[package]
name = "cml-core"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for core Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cbor_event = "2.2.0"
linked-hash-map = "0.5.6"
derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.57"
schemars = "0.8.22"

bech32 = "0.12.0"
hex = "0.4.0"
itertools = "0.15.0"
getrandom = { version = "0.2.3", features = ["js"] }
rand = "0.8.5"
fraction = "0.15.4"
base64 = "0.22.1"
num-bigint = "0.4.6"
num-integer = "0.1.46"
thiserror = "2.0.18"
cfg-if = "1.0.0"


[dev-dependencies]
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
rand_chacha = "0.3.1"
