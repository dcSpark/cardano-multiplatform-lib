[package]
name = "cml-core"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for core Cardano blockchain functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cbor_event = { git = "https://github.com/dcSpark/cbor_event", rev = "e2bca6d257f70ab0c226c4efd0726d3f5c1b4490" }
linked-hash-map = "0.5.6"
derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.57"
schemars = "1.2.1"

bech32 = "0.12.0"
hex = "0.4.3"
itertools = "0.15.0"
fraction = "0.15.4"
base64 = "0.22.1"
num-bigint = "0.4.6"
num-integer = "0.1.46"
thiserror = "2.0.18"
cfg-if = "1.0.4"


[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
