[package]
name = "cml-crypto"
version = "6.0.1"
edition = "2018"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for Cardano-related cryptographic functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# these features are only used within chain-libs
generic-serialization = []
property-test-api = []

[dependencies]
cml-core = { "path" = "../../core/rust", version = "6.0.1" }
base64 = "0.21.5"
cbor_event.workspace = true
cryptoxide = "0.4.2"
ed25519-bip32 = "0.4.1"
sha2 = "^0.9"
digest = "^0.9"
bech32 = "0.7.2"
hex.workspace = true
thiserror.workspace = true
rand = "0.8.5"
cfg-if = "1"

derivative.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
rand_chacha = "0.3.1"
