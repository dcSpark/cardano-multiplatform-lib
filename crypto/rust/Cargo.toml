[package]
name = "cml-crypto"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for Cardano-related cryptographic functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-core = { "path" = "../../core/rust", version = "6.2.0" }
base64 = "0.22.1"
cbor_event = "2.2.0"
cryptoxide = "0.4.2"
ed25519-bip32 = "0.4.1"
sha2 = "0.10.9"
digest = "0.10.7"
bech32 = "0.12.0"
hex = "0.4.0"
thiserror = "2.0.18"
rand = "0.8.5"
cfg-if = "1.0.0"

derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.57"
schemars = "0.8.22"

[dev-dependencies]
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
rand_chacha = "0.3.1"
