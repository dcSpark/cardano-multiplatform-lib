[package]
name = "cml-crypto-wasm"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform WASM SDK for Cardano-related cryptographic functionality"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cml-core-wasm = { path = "../../core/wasm", version = "6.2.0" }
cml-crypto = { path = "../rust", version = "6.2.0" }
cbor_event = "2.4.0"
wasm-bindgen = { version = "0.2.126" }
linked-hash-map = "0.5.6"
serde_json = "1.0.57"

# Runtime keygen test runs in Node via wasm-bindgen-test-runner on wasm32 (see tests/keygen_runtime.rs).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"
