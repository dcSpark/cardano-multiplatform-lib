# cargo-deny config. Run locally with `cargo deny check`.
# In CI this is advisory-only (continue-on-error) until the dependency modernization
# pass lands; after that, drop the continue-on-error so it gates merges.

[graph]
all-features = true

[advisories]
version = 2
# Add specific RUSTSEC ids here once triaged (e.g. unmaintained `derivative`),
# rather than disabling the check wholesale.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "allow" # codegen/plutus tooling references git dependencies
