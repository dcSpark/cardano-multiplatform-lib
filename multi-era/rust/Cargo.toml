[package]
name = "cml-multi-era"
version = "6.2.0"
edition = "2024"
authors = ["dcSpark"]
license = "MIT"
description = "Multiplatform SDK for era-agnostic Cardano blockchain parsing"
documentation = "https://github.com/dcSpark/cardano-multiplatform-lib/docs"
repository = "https://github.com/dcSpark/cardano-multiplatform-lib"
readme = "../../README.md"
keywords = ["cardano"]

[package.metadata.cddl-codegen]
generated-with = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
used_from_wasm = ["dep:wasm-bindgen"]

[dependencies]
cml-core = { path = "../../core/rust", version = "6.2.0" }
cml-crypto = { path = "../../crypto/rust", version = "6.2.0" }
cml-chain = { path = "../../chain/rust", version = "6.2.0" }
cbor_event = "3.2.0"
linked-hash-map = "0.5.6"
derivative = "2.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.57", features = ["float_roundtrip"] }
schemars = "1.2.1"

# only for declaring hash types
bech32 = "0.12.0"
hex = "0.4.3"

# wasm
wasm-bindgen = { version = "0.2.126", optional = true }

[dev-dependencies]
# integration tests (tests/) are a separate crate and don't inherit the normal deps above
hex = "0.4.0"
